<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" role="img" aria-labelledby="title desc"><title id="title">Heimwegschleppe: auf dem Rückweg die Duftspur legen</title><desc id="desc">Gestrichelte dunkle Pfeile führen nach außen. Grüne Pfeile führen vom äußeren Startpunkt zurück nach Hause.</desc><defs><marker id="out" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#657069"/></marker><marker id="in" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#32664e"/></marker></defs><rect width="640" height="620" fill="#f4f3ed"/><g stroke-width="3"><g transform="translate(320 270) rotate(0)"><path d="M100 -16H220" stroke="#657069" stroke-dasharray="7 6" marker-end="url(#out)"/><path d="M220 16H100" stroke="#32664e" marker-end="url(#in)"/></g><g transform="translate(320 270) rotate(90)"><path d="M100 -16H220" stroke="#657069" stroke-dasharray="7 6" marker-end="url(#out)"/><path d="M220 16H100" stroke="#32664e" marker-end="url(#in)"/></g><g transform="translate(320 270) rotate(180)"><path d="M100 -16H220" stroke="#657069" stroke-dasharray="7 6" marker-end="url(#out)"/><path d="M220 16H100" stroke="#32664e" marker-end="url(#in)"/></g><g transform="translate(320 270) rotate(270)"><path d="M100 -16H220" stroke="#657069" stroke-dasharray="7 6" marker-end="url(#out)"/><path d="M220 16H100" stroke="#32664e" marker-end="url(#in)"/></g></g><circle cx="320" cy="270" r="80" fill="#e1e7dc"/><g fill="#202723" font-family="Arial" text-anchor="middle"><text x="320" y="267" font-size="24" font-weight="bold">Zuhause</text><text x="320" y="292" font-size="13">oder Entlaufort</text><text x="320" y="37" font-size="14">Äußerer Startpunkt</text></g><path d="M65 520H125" stroke="#657069" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#out)"/><path d="M65 558H125" stroke="#32664e" stroke-width="3" marker-end="url(#in)"/><g font-family="Arial" fill="#202723" font-size="17"><text x="151" y="526">Hinweg: Kleidungsstück in der Tüte</text><text x="151" y="564">Rückweg: Duftspur Richtung Zuhause</text><text x="65" y="600" font-size="13">Schematisch · Sichere Wege mit dem Helferteam abstimmen.</text></g></svg>